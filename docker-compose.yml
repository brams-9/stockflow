services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: stockflow
    volumes:
      - ./backend/db/seed:/seed
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "stockflow", "-d", "stockflow", "-f", "/seed/seed.sql"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
